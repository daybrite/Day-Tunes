# Build, test, package, and release Day Tunes with the reusable workflow every Day app uses
# (daybrite/actions).
name: ci

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  # Marking a pre-release as a release (or publishing one) rebuilds the website against it.
  release:
    types: [released]
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *" # daily (UTC)

# The repository's own jobs run this checkout's code with a read-only token. The write grants
# sit on the job that calls the shared workflow, whose release and Pages jobs alone use them;
# its build legs, which run this code too, narrow their token to read-only themselves.
permissions:
  contents: read

jobs:
  app:
    uses: daybrite/actions/.github/workflows/dayapp.yml@v1
    permissions:
      contents: write # release assets on tags
      pages: write # deploy-web
      id-token: write # deploy-pages OIDC
    secrets: inherit
    with:
      targets: windows-winui, macos-appkit, linux-gtk, linux-qt, ios-uikit, android-mdc, harmony-arkui, web-dom
      scripts: dayscript/walkthrough.yaml
      # The walkthrough reads the small catalog bundled under resource/assets/catalog-fixture
      # instead of downloading the published one: no network, and the same code path.
      launch-env: TUNES_CATALOG_URL=asset:catalog-fixture
      locales: en
      app-id: dev.daybrite.tunes
      deploy-web: true
