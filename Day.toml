# The Day project manifest (https://daybrite.dev/docs/reference/cli). `name`/`version` come from
# Cargo.toml; any [app] property may be overridden per platform, toolkit, or target.
schema = 1

[app]
id = "dev.daybrite.tunes"
title = "Day Tunes"
build = 5
targets = ["macos-appkit", "macos-gtk", "macos-qt", "ios-uikit", "android-material", "linux-gtk", "linux-qt", "windows-winui", "windows-gtk", "windows-qt", "harmony-arkui", "web-dom"]

# The window's geometry in points (https://daybrite.dev/docs/reference/size-classes). `width`/`height` are
# the desktop default and the size a desktop-windowing Android window opens at; the minimum is
# how small the system may make it. `day build` carries all four into the Android manifest's
# <layout> element and the iOS Info.plist, so declare them here rather than in either.
[window]
width = 960
height = 640
min_width = 320
min_height = 400

# Permissions the app's parts need (https://daybrite.dev/docs/reference/permissions). The
# keychain, which keeps the scrobbler's session key, brings the biometrics part along; its
# reason is the catalog's `permission_biometrics` message.
[permissions]
biometrics = true

# Native host customization; build projects are generated by Day.
[android]
cleartext-traffic = true
