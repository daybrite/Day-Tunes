[package]
name = "day-tunes"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
description = "A music player: your own library, internet radio, and podcasts on every platform."
# Generates typed `res::` constants from `resource/` (see build.rs).
build = "build.rs"

[features]
# `mock` keeps bare cargo and rust-analyzer compiling; `day build` overrides it with
# `--no-default-features --features <backend>` (https://daybrite.dev/docs/reference/project-structure).
default = ["mock"]
appkit = ["day/appkit"]
gtk = ["day/gtk"]
qt = ["day/qt"]
uikit = ["day/uikit"]
material = ["day/material"]
xaml = ["day/xaml"]
winui = ["day/winui"]
arkui = ["day/arkui"]
dom = ["day/dom"]
mock = ["day/mock"]

# rlib for the desktop bin; the mobile pipeline requests staticlib/cdylib via `cargo rustc`.
[lib]
# A constant lib name: staged artifacts and the `dayapp::` import never move on a package rename.
name = "dayapp"
crate-type = ["rlib"]

[dependencies]
# The listener's store: tracks, playlists, stations, podcasts, history (src/library.rs).
day = { package = "day-app", version = "0.6", features = ["http-image", "model"] }
day-pieces = "0.6"
day-persistence = "0.1"
# The player (an app-owned `AudioSession`) and the tag reader the library scanner uses.
day-piece-media = "0.4"
day-piece-settings = "0.6"
# The radio index, the podcast directory, feeds, episode downloads and scrobbles all go over HTTP.
day-part-http = "0.6"
# Imported media, artwork and downloaded episodes live under the app's data directory.
day-part-filesystem = "0.6"
# Scrobbler session keys.
day-part-keychain = "0.6"
# Index and directory responses are JSON; the podcast feed parser is the app's own (src/podcasts.rs).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
day-build = "0.6"


[workspace]

[workspace.package]
version = "0.2.0"
